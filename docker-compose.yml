services:
  postgres:
    image: postgres:16-alpine
    container_name: porfiria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: porfiria
      POSTGRES_USER: porfiria
      POSTGRES_PASSWORD: porfiria
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porfiria -d porfiria"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: porfiria-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
